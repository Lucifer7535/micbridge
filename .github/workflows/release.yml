name: release

# Builds the APK with the repo's own no-Gradle build script and publishes it
# as a GitHub release. Push a v* tag (or run this workflow on an existing tag)
# and the release is created automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner images already ship the Android SDK; only the two
      # packages build.sh needs are missing. (android-actions/setup-android
      # currently fails because it installs the removed "tools" package.)
      - name: Install build-tools and platform
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_DIR=$sdk" >> "$GITHUB_ENV"
          sdkmanager_bin=$(command -v sdkmanager || ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "platforms;android-30" "build-tools;30.0.3" > /dev/null

      - name: Build
        run: SDK="$SDK_DIR" ./build.sh

      - name: Check tag matches the APK
        run: |
          tag=$(basename "$RELEASE_TAG")
          aapt2="$SDK_DIR/build-tools/30.0.3/aapt2"
          version=$("$aapt2" dump badging micbridge.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "tag=$tag apk=$version"
          test "v$version" = "$tag"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: micbridge.apk
