name: release

# Builds the APK with the repo's own no-Gradle build script and publishes it
# as a GitHub release. Push a v* tag (or run this workflow on an existing tag)
# and the release is created automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-30" "build-tools;30.0.3" > /dev/null

      - name: Build
        run: SDK="$ANDROID_SDK_ROOT" ./build.sh

      - name: Check tag matches the APK
        run: |
          tag=$(basename "$RELEASE_TAG")
          aapt2="$ANDROID_SDK_ROOT/build-tools/30.0.3/aapt2"
          version=$("$aapt2" dump badging micbridge.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "tag=$tag apk=$version"
          test "v$version" = "$tag"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: micbridge.apk
